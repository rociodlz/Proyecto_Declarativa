# Configuración de SWI-Prolog. Las rutas relativas se buscan en el directorio actual
# y después en la carpeta del .jar.

# Ruta del ejecutable swipl. Vacía: se busca en el PATH y en las rutas típicas
# (C:\Program Files\swipl\bin\swipl.exe, /usr/bin/swipl, /opt/homebrew/bin/swipl, ...).
# En Windows use barras normales o dobles: C:/Program Files/swipl/bin/swipl.exe
swipl.ruta=

# Carpeta que contiene puente.pl y la base de conocimiento.
prolog.dir=base_conocimiento

# Tiempo máximo de una consulta, en milisegundos.
timeout.ms=5000
